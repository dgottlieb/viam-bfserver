<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Hello</title>
  </head>
  <body>
    <div>
      <form action="robot_part_search" method="get">
        Search for robot by name: <input type="text" name="robotName" size="30" value="{{.Search}}"/>
        <input type="submit"/>
      </form>
    </div>
    <div>
      Matching Parts. Name: {{.Search}} Count: {{len .RobotParts}}
      {{range .RobotParts}}
      <div>
        <a href="logs?robotPart={{.Name}}">Logs</a>
        <table>
          <tr><td>ID:</td><td>{{.Id}}</td></tr>
          <tr><td>Name:</td><td>{{.Name}}</td></tr>
          <tr><td>Config:</td><td>{{.ConfigAsJSON}}</td></tr>
        </table>
      </div>
      {{end}}
    </div>
  </body>
</html>
